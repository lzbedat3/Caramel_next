<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f4ed" />
    <title>Caramel · נחזור מיד</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #f7f4ed;
        color: #292820;
        font: 16px system-ui;
        text-align: center;
        padding: 24px;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 144px;
        height: 144px;
        object-fit: contain;
      }
      h1 {
        font-size: 28px;
      }
      p {
        line-height: 1.8;
        color: #726b5c;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 14px 28px;
        background: #2a1208;
        color: #fffdf9;
        border-radius: 999px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #a67b46;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/Caramel_Assets/caramel-logo-splash.webp" alt="Caramel" />
      <h1>עוד רגע, חוזרים לקרמל</h1>
      <p>
        נראה שאין חיבור לאינטרנט. התחברו מחדש כדי לראות את התפריט, המחירים
        והזמינות המעודכנים.
      </p>
      <a href="/">ננסה שוב</a>
    </main>
  </body>
</html>
